<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noite Estrelada — Pintura Viva</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #07152b;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
}
</style>
</head>

<body>

<canvas id="pintura"></canvas>

<script>

const canvas = document.getElementById("pintura");
const ctx = canvas.getContext("2d", {
    alpha: false
});

let W = 0;
let H = 0;
let escala = 1;

let tempo = 0;

const mouse = {
    x: -1000,
    y: -1000,
    ativo: false
};

const ondas = [];

const random = (min, max) =>
    Math.random() * (max - min) + min;

const clamp = (v, min, max) =>
    Math.max(min, Math.min(max, v));


/* =========================================================
   REDIMENSIONAMENTO
========================================================= */

function resize() {

    W = window.innerWidth;
    H = window.innerHeight;

    escala = Math.min(
        window.devicePixelRatio || 1,
        2
    );

    canvas.width = W * escala;
    canvas.height = H * escala;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(
        escala,
        0,
        0,
        escala,
        0,
        0
    );
}

window.addEventListener("resize", resize);


/* =========================================================
   FUNDO
========================================================= */

function fundo() {

    const grad = ctx.createLinearGradient(
        0,
        0,
        0,
        H
    );

    grad.addColorStop(0, "#07132f");
    grad.addColorStop(.25, "#102d59");
    grad.addColorStop(.5, "#155078");
    grad.addColorStop(.72, "#183e56");
    grad.addColorStop(1, "#081426");

    ctx.fillStyle = grad;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );
}


/* =========================================================
   PINCELADA
========================================================= */

function pincelada(
    x,
    y,
    comprimento,
    angulo,
    espessura,
    cor,
    alpha = 1,
    curvatura = 0
) {

    ctx.save();

    ctx.translate(x, y);

    ctx.rotate(angulo);

    ctx.globalAlpha = alpha;

    ctx.strokeStyle = cor;

    ctx.lineWidth = espessura;

    ctx.lineCap = "round";

    ctx.lineJoin = "round";

    ctx.beginPath();

    ctx.moveTo(
        -comprimento / 2,
        0
    );

    ctx.quadraticCurveTo(
        0,
        curvatura,
        comprimento / 2,
        0
    );

    ctx.stroke();

    ctx.restore();
}


/* =========================================================
   CÉU — FLUXOS DE TINTA
========================================================= */

function fluxoCeleste(
    cx,
    cy,
    tamanho,
    rotacao,
    cor,
    quantidade,
    espessuraBase
) {

    for (let i = 0; i < quantidade; i++) {

        const progresso =
            i / quantidade;

        const raio =
            progresso * tamanho;

        const angulo =
            rotacao +
            progresso * Math.PI * 4.2;

        const x =
            cx +
            Math.cos(angulo) *
            raio;

        const y =
            cy +
            Math.sin(angulo) *
            raio *
            .48;

        const comprimento =
            random(
                18,
                42
            ) *
            (1 - progresso * .3);

        const direcao =
            angulo +
            Math.PI / 2 +
            random(-.18, .18);

        pincelada(
            x,
            y,
            comprimento,
            direcao,
            random(
                espessuraBase * .5,
                espessuraBase * 1.4
            ),
            cor,
            random(.18, .42),
            random(-5, 5)
        );
    }
}


/* =========================================================
   PEQUENAS PINCELADAS DO CÉU
========================================================= */

function texturaCeu() {

    const cores = [
        "#0c315f",
        "#124875",
        "#1a6380",
        "#2d7182",
        "#416f79",
        "#174365"
    ];

    const quantidade =
        Math.floor(
            W * H / 260
        );

    for (let i = 0; i < quantidade; i++) {

        const x =
            random(0, W);

        const y =
            random(0, H * .72);

        /*
        Evita deixar tudo igualmente
        espalhado.
        */

        const centro =
            Math.abs(
                y - H * .32
            );

        const comprimento =
            random(8, 27);

        const angulo =
            random(
                -Math.PI,
                Math.PI
            );

        pincelada(
            x,
            y,
            comprimento,
            angulo,
            random(1.5, 5),
            cores[
                Math.floor(
                    Math.random() *
                    cores.length
                )
            ],
            random(.12, .32),
            random(-4, 4)
        );
    }
}


/* =========================================================
   GRANDES REDemoinhos
========================================================= */

function grandesFluxos() {

    fluxoCeleste(
        W * .34,
        H * .27,
        Math.min(W, H) * .28,
        -.4,
        "#397b91",
        130,
        5
    );

    fluxoCeleste(
        W * .55,
        H * .25,
        Math.min(W, H) * .34,
        1.3,
        "#438596",
        170,
        5
    );

    fluxoCeleste(
        W * .72,
        H * .29,
        Math.min(W, H) * .24,
        -.8,
        "#285f7c",
        100,
        4
    );

    fluxoCeleste(
        W * .20,
        H * .45,
        Math.min(W, H) * .20,
        .8,
        "#1b5675",
        80,
        4
    );
}


/* =========================================================
   ESTRELA COM PINCELADAS
========================================================= */

function estrela(x, y, tamanho) {

    /*
    Halo
    */

    const halo =
        ctx.createRadialGradient(
            x,
            y,
            0,
            x,
            y,
            tamanho * 5
        );

    halo.addColorStop(
        0,
        "rgba(255,235,130,.28)"
    );

    halo.addColorStop(
        .45,
        "rgba(255,213,70,.09)"
    );

    halo.addColorStop(
        1,
        "rgba(255,213,70,0)"
    );

    ctx.fillStyle = halo;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        tamanho * 5,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
    Pinceladas radiais
    */

    const quantidade = 16;

    for (
        let i = 0;
        i < quantidade;
        i++
    ) {

        const a =
            i / quantidade *
            Math.PI * 2;

        pincelada(
            x +
            Math.cos(a) *
            tamanho *
            .7,

            y +
            Math.sin(a) *
            tamanho *
            .7,

            tamanho *
            random(1.5, 3.5),

            a,

            random(
                2,
                5
            ),

            Math.random() > .5
                ? "#f7d96a"
                : "#ffe98b",

            random(.45, .85),

            random(-2, 2)
        );
    }


    /*
    Centro
    */

    ctx.fillStyle =
        "#fff2a1";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        tamanho * .55,
        0,
        Math.PI * 2
    );

    ctx.fill();
}


/* =========================================================
   ESTRELAS DA COMPOSIÇÃO
========================================================= */

function estrelas() {

    const lista = [

        [.73, .17, 13],
        [.82, .25, 17],
        [.60, .16, 7],
        [.48, .28, 8],
        [.34, .19, 6],
        [.25, .31, 10],
        [.89, .38, 7],
        [.14, .40, 6],
        [.52, .41, 8],
        [.68, .38, 6]

    ];

    for (const s of lista) {

        estrela(
            W * s[0],
            H * s[1],
            s[2]
        );
    }
}


/* =========================================================
   LUA
========================================================= */

function lua() {

    const x = W * .77;
    const y = H * .17;

    const r =
        Math.min(W, H) * .055;


    /*
    Halo
    */

    const halo =
        ctx.createRadialGradient(
            x,
            y,
            0,
            x,
            y,
            r * 4
        );

    halo.addColorStop(
        0,
        "rgba(255,222,80,.35)"
    );

    halo.addColorStop(
        .35,
        "rgba(255,207,65,.12)"
    );

    halo.addColorStop(
        1,
        "rgba(255,207,65,0)"
    );

    ctx.fillStyle = halo;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        r * 4,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
    Lua em pinceladas
    */

    for (let i = 0; i < 55; i++) {

        const a =
            random(0, Math.PI * 2);

        const distancia =
            random(0, r);

        pincelada(
            x +
            Math.cos(a) *
            distancia,

            y +
            Math.sin(a) *
            distancia,

            random(5, 16),

            a,

            random(2, 5),

            Math.random() > .4
                ? "#f0c94e"
                : "#ffe47b",

            .35,
            random(-2, 2)
        );
    }


    ctx.fillStyle =
        "#f7d965";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        r * .72,
        0,
        Math.PI * 2
    );

    ctx.fill();
}


/* =========================================================
   MONTANHAS
========================================================= */

function montanhas() {

    ctx.fillStyle =
        "#102b3b";

    ctx.beginPath();

    ctx.moveTo(
        0,
        H * .73
    );

    for (
        let x = 0;
        x <= W;
        x += 25
    ) {

        const y =
            H * .69 +
            Math.sin(x * .008) * 30 +
            Math.sin(x * .021) * 13;

        ctx.lineTo(
            x,
            y
        );
    }

    ctx.lineTo(
        W,
        H
    );

    ctx.lineTo(
        0,
        H
    );

    ctx.closePath();

    ctx.fill();


    /*
    Pinceladas das montanhas
    */

    for (let i = 0; i < 180; i++) {

        const x =
            random(0, W);

        const y =
            H * .67 +
            random(0, H * .16);

        pincelada(
            x,
            y,
            random(10, 35),
            random(
                -2.8,
                -0.3
            ),
            random(2, 5),
            "#17394a",
            .45,
            random(-4, 4)
        );
    }
}


/* =========================================================
   VILA
========================================================= */

function vila() {

    const base =
        H * .82;

    /*
    Fundo
    */

    ctx.fillStyle =
        "#070d17";

    ctx.fillRect(
        0,
        base,
        W,
        H - base
    );


    const casas = 20;

    for (let i = 0; i < casas; i++) {

        const x =
            i *
            (W / casas);

        const largura =
            random(
                W / casas * .6,
                W / casas * .95
            );

        const altura =
            random(
                35,
                95
            );


        ctx.fillStyle =
            "#0b111b";

        ctx.beginPath();

        ctx.rect(
            x,
            base - altura,
            largura,
            altura
        );

        ctx.fill();


        /*
        telhado
        */

        ctx.beginPath();

        ctx.moveTo(
            x - 4,
            base - altura
        );

        ctx.lineTo(
            x + largura / 2,
            base - altura - 20
        );

        ctx.lineTo(
            x + largura + 4,
            base - altura
        );

        ctx.closePath();

        ctx.fill();


        /*
        janela
        */

        if (Math.random() > .35) {

            ctx.fillStyle =
                "rgba(242,190,75,.7)";

            ctx.fillRect(
                x + largura * .45,
                base - altura * .55,
                4,
                7
            );
        }
    }


    /*
    Igreja
    */

    const igrejaX =
        W * .53;

    const igrejaBase =
        base;

    ctx.fillStyle =
        "#0a111c";

    ctx.fillRect(
        igrejaX,
        igrejaBase - 110,
        45,
        110
    );

    ctx.beginPath();

    ctx.moveTo(
        igrejaX - 12,
        igrejaBase - 110
    );

    ctx.lineTo(
        igrejaX + 22,
        igrejaBase - 150
    );

    ctx.lineTo(
        igrejaX + 57,
        igrejaBase - 110
    );

    ctx.closePath();

    ctx.fill();


    /*
    Cruz
    */

    ctx.strokeStyle =
        "#0a111c";

    ctx.lineWidth = 5;

    ctx.beginPath();

    ctx.moveTo(
        igrejaX + 22,
        igrejaBase - 175
    );

    ctx.lineTo(
        igrejaX + 22,
        igrejaBase - 145
    );

    ctx.moveTo(
        igrejaX + 12,
        igrejaBase - 163
    );

    ctx.lineTo(
        igrejaX + 32,
        igrejaBase - 163
    );

    ctx.stroke();
}


/* =========================================================
   CIPRESTE
========================================================= */

function cipreste() {

    const x =
        W * .13;

    const base =
        H * 1.03;

    /*
    tronco
    */

    ctx.fillStyle =
        "#071c20";

    ctx.beginPath();

    ctx.moveTo(
        x - 30,
        base
    );

    ctx.bezierCurveTo(
        x - 70,
        base - 180,
        x - 35,
        base - 300,
        x + 5,
        base - 500
    );

    ctx.bezierCurveTo(
        x + 45,
        base - 330,
        x + 65,
        base - 190,
        x + 35,
        base
    );

    ctx.closePath();

    ctx.fill();


    /*
    Textura do cipreste
    */

    for (let i = 0; i < 500; i++) {

        const y =
            random(
                base - 500,
                base
            );

        const progresso =
            (base - y) / 500;

        const largura =
            20 +
            progresso * 45;

        const px =
            x +
            random(
                -largura,
                largura
            );

        pincelada(
            px,
            y,
            random(10, 35),
            random(
                -1.9,
                -1.2
            ),
            random(2, 6),
            Math.random() > .5
                ? "#0b302c"
                : "#123c31",
            .45,
            random(-4, 4)
        );
    }
}


/* =========================================================
   ONDA DE INTERAÇÃO
========================================================= */

function criarOnda(x, y) {

    ondas.push({

        x,
        y,

        raio: 0,

        vida: 1

    });

    if (ondas.length > 8) {
        ondas.shift();
    }
}


function desenharOndas() {

    for (const onda of ondas) {

        onda.raio += 3;

        onda.vida -= .012;

        ctx.strokeStyle =
            `rgba(
                240,
                210,
                100,
                ${onda.vida * .15}
            )`;

        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.arc(
            onda.x,
            onda.y,
            onda.raio,
            0,
            Math.PI * 2
        );

        ctx.stroke();
    }
}


/* =========================================================
   INTERAÇÃO
========================================================= */

canvas.addEventListener(
    "pointermove",
    e => {

        mouse.x = e.clientX;
        mouse.y = e.clientY;
        mouse.ativo = true;

    }
);

canvas.addEventListener(
    "pointerleave",
    () => {

        mouse.ativo = false;

    }
);

canvas.addEventListener(
    "pointerdown",
    e => {

        criarOnda(
            e.clientX,
            e.clientY
        );

    }
);


/* =========================================================
   GRANULAÇÃO
========================================================= */

function texturaFinal() {

    /*
    Pequena textura sobre toda a tela.
    */

    const quantidade =
        Math.floor(
            W * H / 120
        );

    ctx.save();

    ctx.globalAlpha = .035;

    for (let i = 0; i < quantidade; i++) {

        const x =
            Math.random() * W;

        const y =
            Math.random() * H;

        ctx.fillStyle =
            Math.random() > .5
                ? "#fff0aa"
                : "#00101e";

        ctx.fillRect(
            x,
            y,
            random(1, 3),
            random(1, 3)
        );
    }

    ctx.restore();
}


/* =========================================================
   PINTURA
========================================================= */

function pintar() {

    fundo();

    grandesFluxos();

    texturaCeu();

    estrelas();

    lua();

    montanhas();

    vila();

    cipreste();

    desenharOndas();

    texturaFinal();
}


/* =========================================================
   ANIMAÇÃO
========================================================= */

function animar() {

    tempo += .008;

    /*
    Recriar a pintura inteira a cada
    frame permite que as pinceladas
    tenham uma pequena variação.
    */

    pintar();

    requestAnimationFrame(
        animar
    );
}


/* =========================================================
   INÍCIO
========================================================= */

resize();

animar();

</script>

</body>
</html>
